name: build-flasher

on:
  workflow_dispatch:
  push:
    tags: ["flasher-v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos-arm64
          - os: macos-13
            name: macos-x64
          - os: windows-latest
            name: windows
          - os: ubuntu-latest
            name: linux-x64
          - os: ubuntu-24.04-arm
            name: linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxcb-xinerama0 libxcb-render-util0 libdbus-1-3

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt pyinstaller

      - name: Run tests (headless)
        shell: bash
        run: |
          QT_QPA_PLATFORM=offscreen python -m unittest discover -s tests

      - name: Build (macOS .app + dmg)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          pyinstaller --noconfirm --windowed --name AI-Passport-Flasher \
            --osx-bundle-identifier org.folotoy.aipassport.flasher \
            --collect-data esptool run.py
          hdiutil create -volname AI-Passport-Flasher \
            -srcfolder dist/AI-Passport-Flasher.app -ov -format UDZO \
            dist/AI-Passport-Flasher-${{ matrix.name }}.dmg
          ls -la dist

      - name: Build (Windows onefile exe)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          pyinstaller --noconfirm --onefile --windowed --name AI-Passport-Flasher \
            --collect-data esptool run.py
          ls -la dist

      - name: Build (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          pyinstaller --noconfirm --windowed --name AI-Passport-Flasher \
            --collect-data esptool run.py
          cp -R dist/AI-Passport-Flasher dist-pkg
          printf '#!/bin/sh\nHERE="$(dirname "$(readlink -f "$0")")"\nexec "$HERE/AI-Passport-Flasher" "$@"\n' > dist-pkg/run.sh
          chmod +x dist-pkg/AI-Passport-Flasher dist-pkg/run.sh
          tar -czf AI-Passport-Flasher-${{ matrix.name }}.tar.gz -C dist-pkg .
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: AI-Passport-Flasher-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.exe
            *.tar.gz
          if-no-files-found: warn

  build-extract:
    if: startsWith(github.ref, 'refs/tags/flasher-v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos-arm64
          - os: macos-13
            name: macos-x64
          - os: ubuntu-latest
            name: linux-x64
          - os: ubuntu-24.04-arm
            name: linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxcb-xinerama0 libxcb-render-util0 libdbus-1-3

      - name: Install deps
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller "PySide6>=6.6,<6.9"

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          pyinstaller --noconfirm --onefile --console --name extract_play extract_play.py
          pyinstaller --noconfirm --onefile --windowed --name extract_play_gui extract_play_gui.py
          cp dist/extract_play.exe extract_play.exe
          cp dist/extract_play_gui.exe extract_play_gui.exe
          ls -la

      - name: Build (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          pyinstaller --noconfirm --windowed --name extract_play_gui extract_play_gui.py
          pyinstaller --noconfirm --onefile --console --name extract_play extract_play.py
          mkdir -p pkg
          cp -R dist/extract_play_gui.app pkg/
          cp dist/extract_play pkg/
          hdiutil create -volname extract-play -srcfolder pkg -ov -format UDZO \
            extract_play-${{ matrix.name }}.dmg
          ls -la

      - name: Build (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          pyinstaller --noconfirm --windowed --name extract_play_gui extract_play_gui.py
          pyinstaller --noconfirm --onefile --console --name extract_play extract_play.py
          tar -czf extract_play-${{ matrix.name }}.tar.gz -C dist .
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: extract-play-${{ matrix.name }}
          path: |
            extract_play.exe
            extract_play_gui.exe
            *.dmg
            *.tar.gz
          if-no-files-found: warn

  release:
    needs: [build, build-extract]
    if: startsWith(github.ref, 'refs/tags/flasher-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: AI-Passport-Flasher-*
      - uses: actions/download-artifact@v4
        with:
          pattern: extract-play-*
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            AI-Passport-Flasher-macos-*/dist/*.dmg
            AI-Passport-Flasher-windows/dist/*.exe
            AI-Passport-Flasher-linux-*/*.tar.gz
            extract-play-windows/*.exe
            extract-play-macos-*/*.dmg
            extract-play-linux-*/*.tar.gz
          fail_on_unmatched_files: false
