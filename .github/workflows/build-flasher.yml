name: build-flasher

on:
  workflow_dispatch:
  push:
    tags: ["flasher-v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos
          - os: windows-latest
            name: windows
          - os: ubuntu-latest
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxcb-xinerama0 libxcb-render-util0 libdbus-1-3

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt pyinstaller

      - name: Run tests (headless)
        shell: bash
        run: |
          QT_QPA_PLATFORM=offscreen python -m unittest discover -s tests

      - name: Build (macOS .app)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --windowed --name AI-Passport-Flasher \
            --osx-bundle-identifier org.folotoy.aipassport.flasher \
            --collect-data esptool --collect-submodules esptool run.py
          hdiutil create -volname AI-Passport-Flasher \
            -srcfolder dist/AI-Passport-Flasher.app -ov -format UDZO \
            dist/AI-Passport-Flasher-macos-${{ runner.arch }}.dmg
          ls -la dist

      - name: Build (Windows onefile exe)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconfirm --onefile --windowed --name AI-Passport-Flasher \
            --collect-data esptool --collect-submodules esptool run.py
          ls -la dist

      - name: Build (Linux AppImage)
        if: runner.os == 'Linux'
        run: |
          pyinstaller --noconfirm --onefile --windowed --name AI-Passport-Flasher \
            --collect-data esptool --collect-submodules esptool run.py
          mkdir -p AppDir/usr/bin
          cp dist/AI-Passport-Flasher AppDir/usr/bin/
          printf '#!/bin/sh\nHERE="$(dirname "$(readlink -f "$0")")"\nexec "$HERE/usr/bin/AI-Passport-Flasher" "$@"\n' > AppDir/AppRun
          chmod +x AppDir/AppRun
          printf '[Desktop Entry]\nName=AI Passport Flasher\nExec=AI-Passport-Flasher\nType=Application\nCategories=Utility;\n' > AppDir/AI-Passport-Flasher.desktop
          wget -q -O appimagetool "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" || true
          chmod +x appimagetool 2>/dev/null || true
          if [ -x ./appimagetool ]; then
            ARCH=x86_64 ./appimagetool AppDir AI-Passport-Flasher-x86_64.AppImage
            rm -rf AppDir
          else
            # 兜底:打包 tar.gz
            tar -czf AI-Passport-Flasher-linux-x86_64.tar.gz -C dist AI-Passport-Flasher
          fi
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: AI-Passport-Flasher-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.exe
            *.AppImage
            *.tar.gz
          if-no-files-found: warn

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/flasher-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: AI-Passport-Flasher-*
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            AI-Passport-Flasher-macos-arm64.dmg
            AI-Passport-Flasher.exe
            AI-Passport-Flasher-x86_64.AppImage
            AI-Passport-Flasher-linux-x86_64.tar.gz
          fail_on_unmatched_files: false
